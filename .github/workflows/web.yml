name: Web version

# Builds the browser version of the game with pygbag
# and publishes it on GitHub Pages.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with pygbag
        run: |
          pip install pygbag==0.9.3
          mkdir -p web/KeepUps
          cp keepups.py web/KeepUps/main.py
          cd web
          python -m pygbag --build --title KeepUps KeepUps
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/KeepUps/build/web

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
